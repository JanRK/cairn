# Example only: a minimal way to run cairn on Kubernetes. Adapt to your cluster.
# Review side (8081) is not exposed; reach it with:
#   kubectl port-forward deploy/cairn 8081:8081
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cairn-data
  labels:
    app.kubernetes.io/name: cairn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cairn
  labels:
    app.kubernetes.io/name: cairn
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cairn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cairn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cairn
          # Pin a release tag (vX.Y.Z) or digest in real use; :latest can roll an unexpected build.
          image: ghcr.io/janrk/cairn:latest
          env:
            - name: CAIRN_DB_PATH
              value: /data/cairn.db
            - name: CAIRN_ADDR
              value: ":8080"
            - name: CAIRN_REVIEW_ADDR
              value: ":8081"
            - name: CAIRN_RETENTION
              value: 168h
            - name: CAIRN_LOG_LEVEL
              value: info
          ports:
            - name: agent
              containerPort: 8080
            - name: review
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: agent
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: agent
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cairn-data
---
apiVersion: v1
kind: Service
metadata:
  name: cairn
  labels:
    app.kubernetes.io/name: cairn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cairn
  ports:
    - name: agent
      port: 8080
      targetPort: agent
---
# Allows ingress to 8080 only, so all in-cluster ingress to 8081 is denied.
# kubectl port-forward goes through the kubelet and is not subject to this policy.
# Needs a CNI that enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cairn
  labels:
    app.kubernetes.io/name: cairn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cairn
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
